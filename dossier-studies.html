</style></head><body><header class="workbench"><div class="brand-row"><a class="brand" href="./#/lica"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true"><path d="M50 3 57 36 84 16 64 43 97 50 64 57 84 84 57 64 50 97 43 64 16 84 36 57 3 50 36 43 16 16 43 36Z"/><circle cx="50" cy="50" r="18"/><circle cx="50" cy="50" r="8"/></svg> ЖРЕБИЙ</a><a href="./#/lica">К персонажам ↗</a></div><h1>Досье, которое хочется рассматривать</h1><p>Три композиции в атмосфере «Жребия». Иллюстрации сопровождают историю, голоса и поступки.</p><nav class="controls" aria-label="Варианты оформления"><button data-mode="archive" aria-pressed="true">01 · Рукопись</button><button data-mode="chronicle" aria-pressed="false">02 · Театр судьбы</button><button data-mode="cabinet" aria-pressed="false">03 · Нити истории</button><label for="character">Персонаж</label><select id="character"><option value="0">Люциус</option><option value="1">Шмыг</option><option value="2">Портовый священник</option></select></nav></header><p class="intro" id="direction" aria-live="polite"></p><main id="sample" class="sample archive"></main><dialog id="zoom"><button id="closeZoom">Закрыть ×</button><img alt=""><p></p></dialog><script id="study-data" type="application/json">[{"c": {"id": "samik", "player": "Самик", "line": "тифлинг · паладин, преступивший клятву", "lede": "Шулер, который передёргивает карту, торгуется за лишнюю монету и на вопрос о друзьях каждый раз ровно отвечает «нет». И каждый раз оказывается тем, кто снял с плеч плащ.", "who": ["Первая реплика у него всегда язвительная, вторая — по делу; на вопрос он охотнее отвечает вопросом. Деньги считает вслух и требует свою долю даже там, где доля ему не нужна. На прямой вопрос, есть ли у него друзья, отвечает «нет» ровным голосом и отвечает так каждый раз, сколько бы раз ни спрашивали.", "Помогает он всегда с оговоркой. В запечатанном склепе, где нечем дышать, ползёт к задыхающемуся и подтягивает его голову к самому камню, где ещё осталось холодное. Прикованной девушке молча отдаёт свой плащ красной подкладкой к телу и вынимает шпильку из оковы кончиком ножа. Целую камеру лечит со связанными за спиной руками — и добавляет, что так ему было удобнее.", "Молится он на языке, в котором просьб нет вовсе: слова этого языка рассчитаны на сделку, и он выговаривает их медленно, как выговаривают условия. Лечит тем же низким шёпотом, и раненые встают. Себя он при этом объясняет корыстью или удобством — чтобы никто не принял его за доброго.", "К последним главам шуток в его речи меньше, а цена решений выше. Он добивает сдавшегося рыцаря, рассчитав, что демоны привязаны к нему и уйдут; демоны не уходят, и он признаёт это вслух, двумя словами. Потом выходит на открытое место под арбалетами и волочит за шкирку однорукого попутчика, которого знает полдня, крича ему в ухо, что тот слишком молод умирать неестественной смертью."], "look": ["красноватая кожа: в темноте похоже на загар, на свету явно красная", "жёлтые светящиеся глаза — в темноте по ним видно, как он моргает", "длинные кудрявые чёрные волосы", "рога средней длины, изогнутые вверх", "длинный хвост, выходящий из-под плаща; в разговоре лежит неподвижно вдоль ноги", "чёрный плащ с красной подкладкой — по ней видно, где он ранен", "знак на цепочке поверх плаща", "дерзкая ухмылка, которая в плохие минуты становится шире обычного"], "gift": [{"t": "Исцеление инфернальным шёпотом", "d": "Говорит низко и не по-человечески, слова идут не из горла, а откуда-то из-под него. У старушки разглаживаются морщины, у девушки затягивается ссадина, умирающий открывает глаза. Ему для этого не нужны ни свободные руки, ни свет."}, {"t": "Молитва как сделка", "d": "Язык, на котором он молится, не приспособлен просить — только договариваться. Он раскладывает перед собой всё, что у него есть, и выговаривает условия. Иногда ему не отвечают вовсе: ни отказа, ни знака, ни холода, ни тепла."}, {"t": "Оружие, которого нет", "d": "Может призвать себе оружие из воздуха и вести его на расстоянии, не касаясь. Оно облетает и бьёт само."}, {"t": "Четверо без лиц и трое себя", "d": "Умеет поставить вокруг себя четыре фигуры, сотканные из белого и красного разом: они не бьют и не двигаются, но всякий, кто входит в круг, идёт всё медленнее, а потом перестаёт идти. И умеет выпустить из ладони троих себя — одинаковых, в одинаковых плащах, с одинаковой ухмылкой, — сквозь которых стрелы проходят насквозь."}, {"t": "Видит, что перед ним", "d": "Нежить он различает иначе, чем демонов, и говорит об этом без ухмылки — по одному этому остальные всё понимают. Однажды он менял облик на женский; облик держался час, а конкурс шёл два."}], "words": [{"q": "Ниже. Пол — твой друг.", "ch": 2, "when": "в запечатанном склепе, задыхающемуся Вергелию"}, {"q": "Я много чего беру без спроса. Прикованное — нет.", "ch": 3, "when": "за занавесью в Аллее Масок, накрыв прикованную девушку своим плащом"}, {"q": "Не благодарите. Мне так было удобнее.", "ch": 8, "when": "в гоблинской камере, вылечив всех со связанными за спиной руками"}, {"q": "Он на коленях, а они нет.", "ch": 10, "when": "после того, как добил сдавшегося рыцаря и демоны не ушли"}, {"q": "Говорят, очень жестоко было. Хотя я сам видел. Было очень жестоко.", "ch": 11, "when": "за завтраком, глядя в стакан сока"}, {"q": "Это война, Джо! Это война! Ты не живёшь, Джо! Джо, живи!", "ch": 11, "when": "волоча Джо из-под арбалетов у городской стены"}, {"q": "Джо, ты мой лучший друг теперь.", "ch": 12, "when": "по дороге к церкви, обнимая Джо за плечо"}, {"q": "Я развожусь с обманом. Ради тебя, Джо.", "ch": 12, "when": "над мёртвым Джо, снимая кольцо"}, {"q": "Ну, мы зато теперь знаем, как работает огненный шар. Не понаслышке.", "ch": 12, "when": "в коридоре, без бровей"}, {"q": "Пидорасы! Эти суки стоят в центре!", "ch": 12, "when": "встав с пола, в сторону горящей двери"}], "deeds": [{"ch": 2, "t": "В склепе с ядовитым газом дополз до задыхающегося шифтера и подтянул его голову к самому камню, где у пола ещё оставалось холодное."}, {"ch": 3, "t": "Накрыл прикованную девушку своим плащом, красной подкладкой к телу, и вынул шпильку из оковы кончиком ножа. Плащ велел оставить себе."}, {"ch": 4, "t": "Ради победы на деревенском конкурсе красоты стал женщиной. Облик кончился на час раньше конкурса, прямо на сцене, и спасать положение пришлось импровизированной исповедью про паладинов, проклятие и хвост."}, {"ch": 6, "t": "Ночью, пока паладин спал после боя с оборотнем, разрисовал его углём, золой и гримом: подведённые глаза, губы, родинка и сердечко с подписью на доспехе."}, {"ch": 8, "t": "В гоблинской камере выплюнул кляп и с руками за спиной вылечил всех сокамерников шёпотом — и сразу объяснил это удобством."}, {"ch": 10, "t": "Добил стоящего на коленях рыцаря одним точным ударом снизу вверх, рассчитав, что демоны привязаны к нему. Демоны остались. Он сказал «я ошибся» и стал снимать с мёртвого всё по очереди."}, {"ch": 11, "t": "Вышел на простреливаемое место и вытащил за шкирку Джо, которому болтом прибило руку к гитаре, — и всю дорогу орал ему в ухо, что тот не умрёт."}, {"ch": 11, "t": "В закутке за стеной дома разложил перед собой всё, что у него было, и выговаривал условия сделки, чтобы переселить умирающего Джо в тело ушедшего паладина. Ответа не пришло никакого: ни отказа, ни знака."}, {"ch": 12, "t": "Обнял Джо за плечо, нащупал фурункул на шее и не убрал руку; пообещал лучший бордель и благословил на своём языке."}, {"ch": 12, "t": "Дважды ударил булавой в замурованную стену кельи — оба удара посвятил Джо; за стеной открылись ступени в катакомбы."}, {"ch": 12, "t": "Когда Джо умер в третьей клетке, снял кольцо за шестьсот золотых, положил ему на грудь и заговорил в полный голос на инфернальном. Камень раскололся, Джо встал. «Я развожусь с обманом. Ради тебя, Джо»."}, {"ch": 12, "t": "Принял огненный шар в полный рост в дверном проёме, упал под щупальцем твари, лежал между двумя горящими дверями, «притворившись мёртвым», — и встал сам. Заорал своим, где враги: «Эти суки стоят в центре!»"}, {"ch": 12, "t": "Дошёл по льду до ученика мага, положил ладонь ему на грудь, и оба легли в обнимку."}], "ties": [{"who": "Георгос", "t": "Спорят с первой главы и не перестают. Паладин однажды поднял его с пола, когда меч прошёл ему поперёк спины. В прощальном письме Георгос просит развеять его прах — и развеивать должен именно Люциус."}, {"who": "Последний Дварф", "t": "Когда Люциус пропал, Дварф понял это по невзятой доле и пошёл искать его по Улице Борделей, потому что там его знали лучше."}, {"who": "Сандрия", "t": "Знакомы ещё до плена. Он подшучивает над её виноградным соком и тут же разворачивает её к стойке, когда нужно, чтобы говорила она."}, {"who": "Джо", "t": "Однорукий прохожий, которого он знает полдня. Люциус вытаскивает его из-под болтов, оскорбляет всю дорогу, пытается вылечить руками — и торгуется за его душу на инфернальном."}, {"who": "Джо", "t": "Лучший друг с одной ночи. Люциус воскресил его ценой кольца, а Джо после этого перестал узнавать его лицо — и всё равно погладил по затылку."}], "open": ["Отслеживающая булавка Приветствующих утрачена: она осталась на куртке, которую бросили на полу.", "Он взялся вылечить Джо — и не смог: под пальцами лопнули корки, и он убрал руки. Молитва о его переселении осталась без ответа.", "Георгос попросил развеять его прах на вершине горы Олимпия, с двумя условиями: ветер в лицо и развеивать должен Люциус. Просьба не закрыта.", "Мальчик-тифлинг из детского лазарета «удивительно похож» на него — тот же тяжёлый нос. Фронки заметил и не сказал.", "Кольцо за шестьсот золотых истрачено: камень расколот на груди Джо."], "note": "Единственный персонаж, чью внешность игрок описал текстом целиком, — почти готовый визуальный паспорт. В ранних записях его называют жрецом, дальше — паладином, преступившим клятву; в четвёртой главе к нему всё ещё обращаются «жрец». Отдельный узел канона: в одной из аудиозаписей тело Люциуса путают с телом отца Лютера — в книге это два разных человека.", "hero": "lucius-romance", "gal": ["s04-tower-rats", "xx-fallen-2", "s06-camp-ritual", "xx-tax-office"], "kind": "pc", "name": "Люциус", "tag": "отряд", "first": 2}, "r": {"approved": true, "completeCanon": true, "card": "assets/img/characters/lucius/lucius-face-front.webp", "master": "assets/img/characters/lucius/lucius-base-master.webp", "portrait3q": "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "gallery": [{"src": "assets/img/characters/lucius/lucius-base-master.webp", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "master", "cap": "Мастер · ¾", "alt": "Мастер · ¾"}, {"src": "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · ¾", "alt": "Портрет · ¾"}, {"src": "assets/img/characters/lucius/lucius-face-front.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · анфас", "alt": "Портрет · анфас"}, {"src": "assets/img/characters/lucius/lucius-front.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "full", "cap": "В полный рост", "alt": "В полный рост"}, {"src": "assets/img/characters/lucius/lucius-profile.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Профиль", "alt": "Профиль"}, {"src": "assets/img/characters/lucius/lucius-back.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Со спины", "alt": "Со спины"}, {"src": "assets/img/characters/lucius/lucius-hands.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "detail", "cap": "Кисти и украшения", "alt": "Кисти и украшения"}, {"src": "assets/img/characters/lucius/lucius-pose-1.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Рассматривает находку", "alt": "Рассматривает находку"}, {"src": "assets/img/characters/lucius/lucius-pose-2.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Боевая стойка", "alt": "Боевая стойка"}, {"src": "assets/img/characters/lucius/lucius-pose-3.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Магия", "alt": "Магия"}, {"src": "assets/img/characters/lucius/lucius-face-profile.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Лицо · профиль", "alt": "Лицо · профиль"}, {"src": "assets/img/characters/lucius/lucius-scene-01.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 01", "alt": "Сюжет · 01"}, {"src": "assets/img/characters/lucius/lucius-scene-02.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 02", "alt": "Сюжет · 02"}, {"src": "assets/img/characters/lucius/lucius-scene-03.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 03", "alt": "Сюжет · 03"}, {"src": "assets/img/characters/lucius/lucius-scene-04.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 04", "alt": "Сюжет · 04"}, {"src": "assets/img/characters/lucius/lucius-scene-05.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 05", "alt": "Сюжет · 05"}, {"src": "assets/img/characters/lucius/lucius-scene-06.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 06", "alt": "Сюжет · 06"}, {"src": "assets/img/characters/lucius/lucius-sheet.webp", "width": 3600, "height": 2400, "fit": "contain", "canon": true, "role": "sheet", "cap": "Сводный канонический лист", "alt": "Сводный канонический лист"}, {"src": "assets/img/characters/lucius/lucius-details-poses.webp", "width": 3600, "height": 2400, "fit": "contain", "canon": true, "role": "sheet", "cap": "Сводный канонический лист", "alt": "Сводный канонический лист"}], "credit": "Утверждённый канон · полный пакет", "dossier": ["assets/img/characters/lucius/lucius-base-master.webp", "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "assets/img/characters/lucius/lucius-front.webp", "assets/img/characters/lucius/lucius-pose-1.webp", "assets/img/characters/lucius/lucius-pose-2.webp", "assets/img/characters/lucius/lucius-pose-3.webp"]}}, {"c": {"id": "shmyg", "name": "Шмыг", "kind": "npc", "line": "гоблин · при отряде", "tag": "союзник", "lede": "Гоблин-стражник, который однажды заглянул в чужую камеру и решил, что держат там людей совершенно зря.", "who": ["Он служил у Госпожи и ходил в дозоры, из которых возвращался один. Везение он считал профессией: все, с кем он ходил, уже мертвы, а он стоит. В темноте камеры он увидел светящиеся кончики волос фирболга, поздоровался — и в ту же секунду перестал быть тюремщиком. Развязал верёвку, повёл пленных как конвой и по дороге ни разу не сбился.", "Когда шаман поймал его на лжи, Шмыг опустил копьё остриём вперёд — не на шамана, а на своих, — и пятился так, чтобы оставаться между сталью и теми, кто стоял у него за спиной. С тех пор он при отряде. В городской управе его записали как положено, а Последний Дварф на ступенях управы продиктовал ему правила: не брать чужое, не бежать, если человек кричит, и отвечать «состою», а не «принадлежу».", "Дальше он живёт в доме: учит буквы, водит серого лохматого пони, носит на груди щенка мастифа, который тяжелее его самого, и накрывает завтрак с полотенцем через локоть. Ему оставили распоряжения на случай, если отряд не вернётся: найти тела, отвезти к Седрику, приглядеть за пони и щенком, читать не бросать."], "look": ["Зелёная голова, уши, которые дрогнули раньше, чем он придумал ответ", "Копьё стражника и выпяченная грудь — вид человека, на котором держится весь подземный порядок", "Три пары очков с закопчёнными стёклами разом: одни на глазах, вторые задраны на лоб, третьи на затылке стёклами назад", "Три комплекта одежды: формальный с жёсткой манишкой, повседневный просторный и охотничий, капюшон которого налезает на глаза", "Щенок мастифа на груди и серый лохматый пони под собой", "Полотенце через локоть, метла у двери — и апельсиновый сок, поставленный на самый свет"], "words": [{"q": "Меня, знаешь, ни разу не убили. Ни разу. Все, с кем я в дозор ходил, — уже нет, а я вот стою.", "ch": 8}, {"q": "Скажу — веду на ритуал, приказ Госпожи. Никто не спросит, при её имени никто ничего не спрашивает.", "ch": 8}, {"q": "Именем Госпожи. Хорошее имя. Рабочее.", "ch": 8}, {"q": "Сэр Георгос просил передать вам.", "ch": 11}, {"q": "Госпожа! Здравствуйте! Вас не было достаточно долго.", "ch": 12}, {"q": "Поешь сходи.", "ch": 12}], "deeds": [{"ch": 8, "t": "Просунул руку между прутьев и развязал Люциуса, потому что Сандрия попросила вежливо"}, {"ch": 8, "t": "Придумал вывести пленных под видом конвоя на ритуал и провёл колонну мимо трёх постов"}, {"ch": 8, "t": "Когда обман раскрыли, повернул копьё против своих и прикрывал спиной тех, кого вёл"}, {"ch": 9, "t": "Записался в городской управе и выучил правила жизни среди людей — от «не брать чужое» до «не принадлежу»"}, {"ch": 9, "t": "Сел на пол перед листами с крупными знаками и начал учить инфернальные буквы у Фронки"}, {"ch": 11, "t": "Передал Фронки прощальное письмо Георгоса, которое носили за пазухой не час и не два"}, {"ch": 12, "t": "С кучи щебня командовал рабочими у пролома в стене поместья: «Это туда, а ты туда, а ты сюда». О закрытии порта не слышал; Сандрии велел пойти поесть."}], "ties": [{"who": "Сандрия", "t": "Из-за неё он и перешёл: увидел свечение в темноте и решил, что этих держат ни за что"}, {"who": "Последний Дварф", "t": "Диктует ему правила и оставляет распоряжения на случай, если отряд не вернётся"}, {"who": "Фронки", "t": "Учит его буквам — «скоро будем писать на стенах»"}, {"who": "Госпожа Калиста", "t": "Служил у неё стражником и всю дорогу прикрывался её именем"}], "open": ["Что он сделает с комнатой Георгоса, которую тот завещал ему в письме", "Зачем ему три пары очков сразу"], "first": 8, "note": "В ранних главах его имя пишут «Шмык», в последней — «Шмыг»; полное имя записано в управе как Уби Пш-хэ.", "gal": [], "hero": null}, "r": {"card": "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "gallery": [{"src": "assets/img/characters/shmyg/shmyg-master-formal-sunglasses.webp", "cap": "Основной MASTER · формальный", "alt": "Шмыг. Основной референс идентичности. Одна пара солнечных очков, жёсткая манишка, полный рост.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "master"}, {"src": "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "width": 810, "height": 1080, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · ¾", "alt": "Портрет · ¾"}, {"src": "assets/img/characters/shmyg/shmyg-master-casual-straw-no-glasses.webp", "cap": "Дополнительный MASTER · шляпа без очков", "alt": "Шмыг. Тот же Шмыг в повседневной одежде, соломенной шляпе, с открытыми глазами.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-casual-straw-sunglasses.webp", "cap": "Повседневный · шляпа и очки", "alt": "Шмыг. Просторная рубаха и брюки, плетёная соломенная шляпа и одна пара очков.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-hunting-hood-sunglasses.webp", "cap": "Охотничий · капюшон", "alt": "Шмыг. Оливковая туника, коричневая накидка и глубокий капюшон, который он придерживает у очков.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-guard-ch08-spear.webp", "cap": "Стражник главы 8 · копьё", "alt": "Шмыг. Ранний хронологический образ: лохмотья, разномастная кожаная защита, слишком длинное копьё.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-formal-front.webp", "cap": "Формальный · анфас", "alt": "Шмыг. Прямой вид спереди в полный рост.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "full"}, {"src": "assets/img/characters/shmyg/shmyg-formal-profile-facing-left.webp", "cap": "Формальный · профиль влево", "alt": "Шмыг. Строгий профиль: нос направлен влево на изображении.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-formal-back.webp", "cap": "Формальный · спина", "alt": "Шмыг. Прямой вид сзади. На затылке нет запасных очков или ремней.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-formal-profile-facing-right.webp", "cap": "Формальный · профиль вправо", "alt": "Шмыг. Строгий профиль: нос направлен вправо на изображении.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-formal-face-ears-hands.webp", "cap": "Формальный · лицо, уши, кисти", "alt": "Шмыг. Лицо в двух ракурсах, положения ушей, ладонь и тыльная сторона кисти.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "detail"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-turnaround.webp", "cap": "Шляпа без очков · четыре стороны", "alt": "Шмыг. Исправленный лист: анфас, профиль влево, спина, профиль вправо.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-closeups.webp", "cap": "Шляпа без очков · разные крупности", "alt": "Шмыг. Поясной портрет, лицо, профиль, глаза и нос, ухо и плетение шляпы.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "detail"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-three-poses.webp", "cap": "Шляпа без очков · три позы", "alt": "Шмыг. Важный шаг, неподвижное слушание, быстрый настороженный разворот.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-six-emotions.webp", "cap": "Шляпа без очков · шесть эмоций", "alt": "Шмыг. Важность, подозрение, удивление; возмущение, радость, смущение.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "emotion"}, {"src": "assets/img/characters/shmyg/shmyg-scene-01-tunnel-guard.webp", "cap": "01 · Важный проход по тоннелю", "alt": "Шмыг. Один Шмыг-стражник в пустом тоннеле, с длинным копьём.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}, {"src": "assets/img/characters/shmyg/shmyg-scene-02-listening-towel.webp", "cap": "02 · Слушает голос за кадром", "alt": "Шмыг. Средний план: неподвижно слушает, белое полотенце через локоть.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}, {"src": "assets/img/characters/shmyg/shmyg-scene-03-registration.webp", "cap": "03 · Регистрация в управе", "alt": "Шмыг. Один Шмыг заполняет оставленные на столе бумаги.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}, {"src": "assets/img/characters/shmyg/shmyg-scene-04-infernal-letters.webp", "cap": "04 · Крупные инфернальные буквы", "alt": "Шмыг. Близкий план: учится писать, в соломенной шляпе без очков.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}, {"src": "assets/img/characters/shmyg/shmyg-scene-05-breakfast.webp", "cap": "05 · Завтрак, метла и сок", "alt": "Шмыг. Ростовой сюжет: накрывает стол, рядом метла и кувшин апельсинового сока.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}], "credit": "Актуальный визуальный канон Шмыга · 19 иллюстраций", "approved": true, "completeCanon": true, "master": "assets/img/characters/shmyg/shmyg-master-formal-sunglasses.webp", "portrait3q": "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "dossier": ["assets/img/characters/shmyg/shmyg-master-formal-sunglasses.webp", "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "assets/img/characters/shmyg/shmyg-formal-front.webp", "assets/img/characters/shmyg/shmyg-master-casual-straw-no-glasses.webp", "assets/img/characters/shmyg/shmyg-casual-straw-sunglasses.webp", "assets/img/characters/shmyg/shmyg-hunting-hood-sunglasses.webp", "assets/img/characters/shmyg/shmyg-guard-ch08-spear.webp", "assets/img/characters/shmyg/shmyg-straw-no-glasses-three-poses.webp", "assets/img/characters/shmyg/shmyg-straw-no-glasses-six-emotions.webp"]}}, {"c": {"id": "port-priest", "name": "Священник портовой церкви", "kind": "npc", "line": "пожилой, борода до груди · церковь Килимвора", "tag": "нейтральный", "lede": "Старик, который пытался утихомирить пришедших в храм, взял серебряный, отступил перед глазами тифлинга — и сам открыл им ход в катакомбы.", "who": ["Поймал Джо за плечо и тут же отдёрнул руку. Спросил, зачем они шумят в храме, где люди пытаются найти покой. Два серебряных от Люциуса взял так, будто не понял, что это. Когда Георгос написал ему «Катакомбы», лицо у него изменилось, и он сказал: «Следуйте за мной».", "Сначала повёл не вниз, а к своей келье — и застыл перед вырванным замком. В стычке за бумаги из холодного камина вывернул Джо деревянную руку. Показал на шкаф: «Там раньше был проход, но его выложили камнем». Вышел и подпёр за отрядом дверь."], "look": ["Пожилой мужчина с бородой до груди, ряса вытерта на локтях", "Отступает на шаг и ещё на шаг, когда Люциус смотрит ему в глаза", "Сильнее, чем кажется: вырвал стопку бумаг из руки Джо"], "words": [{"q": "Зачем вы шумите в храме?", "ch": 12}, {"q": "Будьте тише. Здесь люди пытаются найти покой.", "ch": 12}, {"q": "Кто-то взломал мою келью.", "ch": 12}, {"q": "Катакомбы. Там были катакомбы.", "ch": 12}, {"q": "Я бы закрыл. Но там сломали замок.", "ch": 12}], "deeds": [{"ch": 11, "t": "Ходил между больными на ступенях, беседовал и осенял знамением; ему уступали дорогу"}, {"ch": 12, "t": "Не дал Люциусу разрушить алтарь"}, {"ch": 12, "t": "Открыл замурованный ход в катакомбы за шкафом в своей келье"}], "ties": [{"who": "Георгос", "t": "Единственный, кому старик отвечал без спора — по дощечке"}, {"who": "Джо", "t": "Вывернул ему деревянную руку, отбирая бумаги"}], "open": ["Знал ли он, что под его церковью держат людей и дракона", "Дошёл ли до него Джо с предупреждением"], "first": 11, "note": "Имени его хроника не называет. Настоятеля церкви зовут Берман — тот ли это человек, неясно: дневник лежал в келье, которую священник назвал своей.", "gal": [], "hero": null}, "r": {"approved": true, "completeCanon": true, "card": "assets/img/characters/port-priest/portrait.webp", "master": "assets/img/characters/port-priest/master.webp", "portrait3q": "assets/img/characters/port-priest/portrait.webp", "gallery": [{"src": "assets/img/characters/port-priest/master.webp", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "master", "cap": "Мастер · основной образ", "alt": "Мастер · основной образ"}, {"src": "assets/img/characters/port-priest/portrait.webp", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · ¾", "alt": "Портрет · ¾"}, {"src": "assets/img/characters/port-priest/front.webp", "width": 512, "height": 1024, "fit": "contain", "canon": true, "role": "full", "cap": "В полный рост", "alt": "В полный рост"}, {"src": "assets/img/characters/port-priest/emotion-1.webp", "width": 768, "height": 512, "fit": "contain", "canon": true, "role": "emotion", "cap": "Участие", "alt": "Участие"}, {"src": "assets/img/characters/port-priest/emotion-2.webp", "width": 768, "height": 512, "fit": "contain", "canon": true, "role": "emotion", "cap": "Тревога", "alt": "Тревога"}, {"src": "assets/img/characters/port-priest/emotion-3.webp", "width": 768, "height": 512, "fit": "contain", "canon": true, "role": "emotion", "cap": "Твё const data=JSON.parse(document.getElementById('study-data').textContent);let mode='archive';const sample=document.getElementById('sample'),select=document.getElementById('character'),zoom=document.getElementById('zoom');const star="<svg viewBox=\"0 0 100 100\" fill=\"none\" stroke=\"currentColor\" aria-hidden=\"true\"><path d=\"M50 3 57 36 84 16 64 43 97 50 64 57 84 84 57 64 50 97 43 64 16 84 36 57 3 50 36 43 16 16 43 36Z\"/><circle cx=\"50\" cy=\"50\" r=\"18\"/><circle cx=\"50\" cy=\"50\" r=\"8\"/></svg>";const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const descriptions={archive:'Рукопись · изображения входят в текст, чередуют масштаб и оставляют место пометкам на полях.',chronicle:'Театр судьбы · крупные сюжетные кадры, текст рядом с действием и портреты в паузах между эпизодами.',cabinet:'Нити истории · асимметричные листы соединяются золотой линией; образы, слова и поступки образуют одну историю.'};function figure(g,cls='story-art'){if(!g)return '';return '<figure class="'+cls+'"><button class="image-button" data-image="'+esc(g.src)+'" data-caption="'+esc(g.cap)+'" aria-label="Увеличить: '+esc(g.cap)+'"><img src="'+esc(g.src)+'" alt="'+esc(g.cap)+'" width="'+g.width+'" height="'+g.height+'" style="height:auto" loading="lazy"></button><figcaption>'+esc(g.cap)+'</figcaption></figure>';}function heading(t){return '<header class="section-head">'+star+'<h3>'+t+'</h3></header>'}function chapter(n){return '<a href="./#/kniga/ch'+String(n).padStart(2,'0')+'">Глава '+n+'</a>'}function render(){const {c,r}=data[select.value];const bySrc=new Map(r.gallery.map(g=>[g.src,g]));const scenes=r.gallery.filter(g=>g.role==='scene');const extras=r.dossier.slice(2).map(s=>bySrc.get(s)).filter(Boolean);let si=0,ei=0;const master=bySrc.get(r.master),portrait=bySrc.get(r.portrait3q);sample.className='sample '+mode;document.getElementById('direction').textContent=descriptions[mode];let h='<section class="hero"><svg class="dial" viewBox="0 0 600 600" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="300" cy="300" r="280"/><circle cx="300" cy="300" r="250" stroke-dasharray="1 12"/><circle cx="300" cy="300" r="215"/><path d="M20 300H580M300 20V580M102 102 498 498M102 498 498 102"/><path d="M300 20 365 235 580 300 365 365 300 580 235 365 20 300 235 235Z"/></svg><div class="hero-copy"><p class="eyebrow">'+esc(c.tag)+' · Впервые в главе '+c.first+'</p><h2>'+esc(c.name)+'</h2><p class="line">'+esc(c.line)+'</p><p class="lede">'+esc(c.lede)+'</p><a class="canon-link" href="./#/lica/'+c.id+'/canon">Посмотреть канон ↗</a></div><div class="art">'+figure(master,'master')+figure(portrait,'portrait')+'</div></section>'+heading('Человек за именем');
(c.who||[]).forEach((p,i)=>{let g=scenes[si]?(si++,scenes[si-1]):extras[ei++];h+='<section class="story-block">'+figure(g)+'<div class="prose"><div class="story-number">'+String(i+1).padStart(2,'0')+' / '+esc(c.name)+'</div><p>'+esc(p)+'</p>'+(c.gift?.[i]?'<aside class="teller-note"><b>'+esc(c.gift[i].t)+'</b><br>'+esc(c.gift[i].d)+'</aside>':'')+'</div></section>';});
h+=heading('Узнать среди других')+'<section class="identity">'+figure(extras[ei++],'identity-art')+'<div><p class="small-label">Приметы</p><ul>'+(c.look||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></section>'+heading('У каждого — свой голос');
(c.words||[]).forEach((q,i)=>{let g=extras[ei++];h+='<section class="quote-scene'+(!g?' without-art':'')+'"><blockquote>«'+esc(q.q)+'»<footer>'+chapter(q.ch)+(q.when?' · '+esc(q.when):'')+'</footer></blockquote>'+figure(g,'voice-art')+'</section>';});
h+=heading('След в истории')+'<div class="timeline">';(c.deeds||[]).forEach((d,i)=>{let g=scenes[si++];h+='<section class="event">'+figure(g,'event-art')+'<div><span class="small-label">'+chapter(d.ch)+'</span><p>'+esc(d.t)+'</p></div></section>';});
while(si<scenes.length){h+='<section class="event">'+figure(scenes[si++],'event-art')+'</section>';}while(ei<extras.length){h+='<section class="event">'+figure(extras[ei++],'event-art')+'</section>';}h+='</div>'+heading('Те, кто рядом')+'<section class="ties">'+(c.ties||[]).map(t=>'<p><b>'+esc(t.who)+'</b>'+esc(t.t)+'</p>').join('')+'</section><footer class="closing"><a href="./#/lica/'+c.id+'/canon">Все ракурсы и детали · полный канон ↗</a><a href="./#/lica/'+c.id+'">Текущее досье ↗</a></footer>';sample.innerHTML=h;sample.querySelectorAll('.hero img').forEach(im=>im.loading='eager');}
