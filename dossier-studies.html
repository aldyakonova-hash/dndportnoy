</style><style>.sample.cabinet .hero{grid-template-columns:minmax(0,1.28fr) minmax(0,.72fr)}.sample .art img,.sample .art .portrait img{max-height:none!important}@media(max-width:1000px){.sample.cabinet .hero{grid-template-columns:1fr}}@media(max-width:550px){#zoom .gallery-stage{display:block;position:relative}#zoom .gallery-stage button{position:absolute;top:50%;transform:translateY(-50%);z-index:1;background:#140e2bd9}#galleryPrev{left:0}#galleryNext{right:0}#zoom .gallery-stage img{width:100%}}</style></head><body><header class="workbench"><div class="brand-row"><a class="brand" href="./#/lica"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" aria-hidden="true"><path d="M50 3 57 36 84 16 64 43 97 50 64 57 84 84 57 64 50 97 43 64 16 84 36 57 3 50 36 43 16 16 43 36Z"/><circle cx="50" cy="50" r="18"/><circle cx="50" cy="50" r="8"/></svg> ЖРЕБИЙ</a><a href="./#/lica">К персонажам ↗</a></div><h1>Досье, которое хочется рассматривать</h1><p>Три композиции в атмосфере «Жребия». Иллюстрации сопровождают историю, голоса и поступки.</p><nav class="controls" aria-label="Варианты оформления"><button data-mode="archive" aria-pressed="true">01 · Рукопись</button><button data-mode="chronicle" aria-pressed="false">02 · Театр судьбы</button><button data-mode="cabinet" aria-pressed="false">03 · Нити истории</button><label for="character">Персонаж</label><select id="character"><option value="0">Люциус</option><option value="1">Шмыг</option><option value="2">Портовый священник</option></select></nav></header><p class="intro" id="direction" aria-live="polite"></p><main id="sample" class="sample archive"></main><dialog id="zoom" aria-label="Галерея иллюстраций"><div class="gallery-bar"><span id="galleryCount" aria-live="polite"></span><button id="closeZoom" aria-label="Закрыть галерею">Закрыть ×</button></div><div class="gallery-stage"><button id="galleryPrev" aria-label="Предыдущее изображение">←</button><img alt=""><button id="galleryNext" aria-label="Следующее изображение">→</button></div><p id="galleryCaption"></p></dialog><script id="study-data" type="application/json">[{"c": {"id": "samik", "player": "Самик", "line": "тифлинг · паладин, преступивший клятву", "lede": "Шулер, который передёргивает карту, торгуется за лишнюю монету и на вопрос о друзьях каждый раз ровно отвечает «нет». И каждый раз оказывается тем, кто снял с плеч плащ.", "who": ["Первая реплика у него всегда язвительная, вторая — по делу; на вопрос он охотнее отвечает вопросом. Деньги считает вслух и требует свою долю даже там, где доля ему не нужна. На прямой вопрос, есть ли у него друзья, отвечает «нет» ровным голосом и отвечает так каждый раз, сколько бы раз ни спрашивали.", "Помогает он всегда с оговоркой. В запечатанном склепе, где нечем дышать, ползёт к задыхающемуся и подтягивает его голову к самому камню, где ещё осталось холодное. Прикованной девушке молча отдаёт свой плащ красной подкладкой к телу и вынимает шпильку из оковы кончиком ножа. Целую камеру лечит со связанными за спиной руками — и добавляет, что так ему было удобнее.", "Молится он на языке, в котором просьб нет вовсе: слова этого языка рассчитаны на сделку, и он выговаривает их медленно, как выговаривают условия. Лечит тем же низким шёпотом, и раненые встают. Себя он при этом объясняет корыстью или удобством — чтобы никто не принял его за доброго.", "К последним главам шуток в его речи меньше, а цена решений выше. Он добивает сдавшегося рыцаря, рассчитав, что демоны привязаны к нему и уйдут; демоны не уходят, и он признаёт это вслух, двумя словами. Потом выходит на открытое место под арбалетами и волочит за шкирку однорукого попутчика, которого знает полдня, крича ему в ухо, что тот слишком молод умирать неестественной смертью."], "look": ["красноватая кожа: в темноте похоже на загар, на свету явно красная", "жёлтые светящиеся глаза — в темноте по ним видно, как он моргает", "длинные кудрявые чёрные волосы", "рога средней длины, изогнутые вверх", "длинный хвост, выходящий из-под плаща; в разговоре лежит неподвижно вдоль ноги", "чёрный плащ с красной подкладкой — по ней видно, где он ранен", "знак на цепочке поверх плаща", "дерзкая ухмылка, которая в плохие минуты становится шире обычного"], "gift": [{"t": "Исцеление инфернальным шёпотом", "d": "Говорит низко и не по-человечески, слова идут не из горла, а откуда-то из-под него. У старушки разглаживаются морщины, у девушки затягивается ссадина, умирающий открывает глаза. Ему для этого не нужны ни свободные руки, ни свет."}, {"t": "Молитва как сделка", "d": "Язык, на котором он молится, не приспособлен просить — только договариваться. Он раскладывает перед собой всё, что у него есть, и выговаривает условия. Иногда ему не отвечают вовсе: ни отказа, ни знака, ни холода, ни тепла."}, {"t": "Оружие, которого нет", "d": "Может призвать себе оружие из воздуха и вести его на расстоянии, не касаясь. Оно облетает и бьёт само."}, {"t": "Четверо без лиц и трое себя", "d": "Умеет поставить вокруг себя четыре фигуры, сотканные из белого и красного разом: они не бьют и не двигаются, но всякий, кто входит в круг, идёт всё медленнее, а потом перестаёт идти. И умеет выпустить из ладони троих себя — одинаковых, в одинаковых плащах, с одинаковой ухмылкой, — сквозь которых стрелы проходят насквозь."}, {"t": "Видит, что перед ним", "d": "Нежить он различает иначе, чем демонов, и говорит об этом без ухмылки — по одному этому остальные всё понимают. Однажды он менял облик на женский; облик держался час, а конкурс шёл два."}], "words": [{"q": "Ниже. Пол — твой друг.", "ch": 2, "when": "в запечатанном склепе, задыхающемуся Вергелию"}, {"q": "Я много чего беру без спроса. Прикованное — нет.", "ch": 3, "when": "за занавесью в Аллее Масок, накрыв прикованную девушку своим плащом"}, {"q": "Не благодарите. Мне так было удобнее.", "ch": 8, "when": "в гоблинской камере, вылечив всех со связанными за спиной руками"}, {"q": "Он на коленях, а они нет.", "ch": 10, "when": "после того, как добил сдавшегося рыцаря и демоны не ушли"}, {"q": "Говорят, очень жестоко было. Хотя я сам видел. Было очень жестоко.", "ch": 11, "when": "за завтраком, глядя в стакан сока"}, {"q": "Это война, Джо! Это война! Ты не живёшь, Джо! Джо, живи!", "ch": 11, "when": "волоча Джо из-под арбалетов у городской стены"}, {"q": "Джо, ты мой лучший друг теперь.", "ch": 12, "when": "по дороге к церкви, обнимая Джо за плечо"}, {"q": "Я развожусь с обманом. Ради тебя, Джо.", "ch": 12, "when": "над мёртвым Джо, снимая кольцо"}, {"q": "Ну, мы зато теперь знаем, как работает огненный шар. Не понаслышке.", "ch": 12, "when": "в коридоре, без бровей"}, {"q": "Пидорасы! Эти суки стоят в центре!", "ch": 12, "when": "встав с пола, в сторону горящей двери"}], "deeds": [{"ch": 2, "t": "В склепе с ядовитым газом дополз до задыхающегося шифтера и подтянул его голову к самому камню, где у пола ещё оставалось холодное."}, {"ch": 3, "t": "Накрыл прикованную девушку своим плащом, красной подкладкой к телу, и вынул шпильку из оковы кончиком ножа. Плащ велел оставить себе."}, {"ch": 4, "t": "Ради победы на деревенском конкурсе красоты стал женщиной. Облик кончился на час раньше конкурса, прямо на сцене, и спасать положение пришлось импровизированной исповедью про паладинов, проклятие и хвост."}, {"ch": 6, "t": "Ночью, пока паладин спал после боя с оборотнем, разрисовал его углём, золой и гримом: подведённые глаза, губы, родинка и сердечко с подписью на доспехе."}, {"ch": 8, "t": "В гоблинской камере выплюнул кляп и с руками за спиной вылечил всех сокамерников шёпотом — и сразу объяснил это удобством."}, {"ch": 10, "t": "Добил стоящего на коленях рыцаря одним точным ударом снизу вверх, рассчитав, что демоны привязаны к нему. Демоны остались. Он сказал «я ошибся» и стал снимать с мёртвого всё по очереди."}, {"ch": 11, "t": "Вышел на простреливаемое место и вытащил за шкирку Джо, которому болтом прибило руку к гитаре, — и всю дорогу орал ему в ухо, что тот не умрёт."}, {"ch": 11, "t": "В закутке за стеной дома разложил перед собой всё, что у него было, и выговаривал условия сделки, чтобы переселить умирающего Джо в тело ушедшего паладина. Ответа не пришло никакого: ни отказа, ни знака."}, {"ch": 12, "t": "Обнял Джо за плечо, нащупал фурункул на шее и не убрал руку; пообещал лучший бордель и благословил на своём языке."}, {"ch": 12, "t": "Дважды ударил булавой в замурованную стену кельи — оба удара посвятил Джо; за стеной открылись ступени в катакомбы."}, {"ch": 12, "t": "Когда Джо умер в третьей клетке, снял кольцо за шестьсот золотых, положил ему на грудь и заговорил в полный голос на инфернальном. Камень раскололся, Джо встал. «Я развожусь с обманом. Ради тебя, Джо»."}, {"ch": 12, "t": "Принял огненный шар в полный рост в дверном проёме, упал под щупальцем твари, лежал между двумя горящими дверями, «притворившись мёртвым», — и встал сам. Заорал своим, где враги: «Эти суки стоят в центре!»"}, {"ch": 12, "t": "Дошёл по льду до ученика мага, положил ладонь ему на грудь, и оба легли в обнимку."}], "ties": [{"who": "Георгос", "t": "Спорят с первой главы и не перестают. Паладин однажды поднял его с пола, когда меч прошёл ему поперёк спины. В прощальном письме Георгос просит развеять его прах — и развеивать должен именно Люциус."}, {"who": "Последний Дварф", "t": "Когда Люциус пропал, Дварф понял это по невзятой доле и пошёл искать его по Улице Борделей, потому что там его знали лучше."}, {"who": "Сандрия", "t": "Знакомы ещё до плена. Он подшучивает над её виноградным соком и тут же разворачивает её к стойке, когда нужно, чтобы говорила она."}, {"who": "Джо", "t": "Однорукий прохожий, которого он знает полдня. Люциус вытаскивает его из-под болтов, оскорбляет всю дорогу, пытается вылечить руками — и торгуется за его душу на инфернальном."}, {"who": "Джо", "t": "Лучший друг с одной ночи. Люциус воскресил его ценой кольца, а Джо после этого перестал узнавать его лицо — и всё равно погладил по затылку."}], "open": ["Отслеживающая булавка Приветствующих утрачена: она осталась на куртке, которую бросили на полу.", "Он взялся вылечить Джо — и не смог: под пальцами лопнули корки, и он убрал руки. Молитва о его переселении осталась без ответа.", "Георгос попросил развеять его прах на вершине горы Олимпия, с двумя условиями: ветер в лицо и развеивать должен Люциус. Просьба не закрыта.", "Мальчик-тифлинг из детского лазарета «удивительно похож» на него — тот же тяжёлый нос. Фронки заметил и не сказал.", "Кольцо за шестьсот золотых истрачено: камень расколот на груди Джо."], "note": "Единственный персонаж, чью внешность игрок описал текстом целиком, — почти готовый визуальный паспорт. В ранних записях его называют жрецом, дальше — паладином, преступившим клятву; в четвёртой главе к нему всё ещё обращаются «жрец». Отдельный узел канона: в одной из аудиозаписей тело Люциуса путают с телом отца Лютера — в книге это два разных человека.", "hero": "lucius-romance", "gal": ["s04-tower-rats", "xx-fallen-2", "s06-camp-ritual", "xx-tax-office"], "kind": "pc", "name": "Люциус", "tag": "отряд", "first": 2}, "r": {"approved": true, "completeCanon": true, "card": "assets/img/characters/lucius/lucius-face-front.webp", "master": "assets/img/characters/lucius/lucius-base-master.webp", "portrait3q": "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "gallery": [{"src": "assets/img/characters/lucius/lucius-base-master.webp", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "master", "cap": "Мастер · ¾", "alt": "Мастер · ¾"}, {"src": "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · ¾", "alt": "Портрет · ¾"}, {"src": "assets/img/characters/lucius/lucius-face-front.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · анфас", "alt": "Портрет · анфас"}, {"src": "assets/img/characters/lucius/lucius-front.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "full", "cap": "В полный рост", "alt": "В полный рост"}, {"src": "assets/img/characters/lucius/lucius-profile.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Профиль", "alt": "Профиль"}, {"src": "assets/img/characters/lucius/lucius-back.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Со спины", "alt": "Со спины"}, {"src": "assets/img/characters/lucius/lucius-hands.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "detail", "cap": "Кисти и украшения", "alt": "Кисти и украшения"}, {"src": "assets/img/characters/lucius/lucius-pose-1.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Рассматривает находку", "alt": "Рассматривает находку"}, {"src": "assets/img/characters/lucius/lucius-pose-2.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Боевая стойка", "alt": "Боевая стойка"}, {"src": "assets/img/characters/lucius/lucius-pose-3.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Магия", "alt": "Магия"}, {"src": "assets/img/characters/lucius/lucius-face-profile.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Лицо · профиль", "alt": "Лицо · профиль"}, {"src": "assets/img/characters/lucius/lucius-scene-01.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 01", "alt": "Сюжет · 01"}, {"src": "assets/img/characters/lucius/lucius-scene-02.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 02", "alt": "Сюжет · 02"}, {"src": "assets/img/characters/lucius/lucius-scene-03.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 03", "alt": "Сюжет · 03"}, {"src": "assets/img/characters/lucius/lucius-scene-04.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 04", "alt": "Сюжет · 04"}, {"src": "assets/img/characters/lucius/lucius-scene-05.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 05", "alt": "Сюжет · 05"}, {"src": "assets/img/characters/lucius/lucius-scene-06.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 06", "alt": "Сюжет · 06"}, {"src": "assets/img/characters/lucius/lucius-sheet.webp", "width": 3600, "height": 2400, "fit": "contain", "canon": true, "role": "sheet", "cap": "Сводный канонический лист", "alt": "Сводный канонический лист"}, {"src": "assets/img/characters/lucius/lucius-details-poses.webp", "width": 3600, "height": 2400, "fit": "contain", "canon": true, "role": "sheet", "cap": "Сводный канонический лист", "alt": "Сводный канонический лист"}], "credit": "Утверждённый канон · полный пакет", "dossier": ["assets/img/characters/lucius/lucius-base-master.webp", "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "assets/img/characters/lucius/lucius-front.webp", "assets/img/characters/lucius/lucius-pose-1.webp", "assets/img/characters/lucius/lucius-pose-2.webp", "assets/img/characters/lucius/lucius-pose-3.webp"]}}, {"c": {"id": "shmyg", "name": "Шмыг", "kind": "npc", "line": "гоблин · при отряде", "tag": "союзник", "lede": "Гоблин-стражник, который однажды заглянул в чужую камеру и решил, что держат там людей совершенно зря.", "who": ["Он служил у Госпожи и ходил в дозоры, из которых возвращался один. Везение он считал профессией: все, с кем он ходил, уже мертвы, а он стоит. В темноте камеры он увидел светящиеся кончики волос фирболга, поздоровался — и в ту же секунду перестал быть тюремщиком. Развязал верёвку, повёл пленных как конвой и по дороге ни разу не сбился.", "Когда шаман поймал его на лжи, Шмыг опустил копьё остриём вперёд — не на шамана, а на своих, — и пятился так, чтобы оставаться между сталью и теми, кто стоял у него за спиной. С тех пор он при отряде. В городской управе его записали как положено, а Последний Дварф на ступенях управы продиктовал ему правила: не брать чужое, не бежать, если человек кричит, и отвечать «состою», а не «принадлежу».", "Дальше он живёт в доме: учит буквы, водит серого лохматого пони, носит на груди щенка мастифа, который тяжелее его самого, и накрывает завтрак с полотенцем через локоть. Ему оставили распоряжения на случай, если отряд не вернётся: найти тела, отвезти к Седрику, приглядеть за пони и щенком, читать не бросать."], "look": ["Зелёная голова, уши, которые дрогнули раньше, чем он придумал ответ", "Копьё стражника и выпяченная грудь — вид человека, на котором держится весь подземный порядок", "Три пары очков с закопчёнными стёклами разом: одни на глазах, вторые задраны на лоб, третьи на затылке стёклами назад", "Три комплекта одежды: формальный с жёсткой манишкой, повседневный просторный и охотничий, капюшон которого налезает на глаза", "Щенок мастифа на груди и серый лохматый пони под собой", "Полотенце через локоть, метла у двери — и апельсиновый сок, поставленный на самый свет"], "words": [{"q": "Меня, знаешь, ни разу не убили. Ни разу. Все, с кем я в дозор ходил, — уже нет, а я вот стою.", "ch": 8}, {"q": "Скажу — веду на ритуал, приказ Госпожи. Никто не спросит, при её имени никто ничего не спрашивает.", "ch": 8}, {"q": "Именем Госпожи. Хорошее имя. Рабочее.", "ch": 8}, {"q": "Сэр Георгос просил передать вам.", "ch": 11}, {"q": "Госпожа! Здравствуйте! Вас не было достаточно долго.", "ch": 12}, {"q": "Поешь сходи.", "ch": 12}], "deeds": [{"ch": 8, "t": "Просунул руку между прутьев и развязал Люциуса, потому что Сандрия попросила вежливо"}, {"ch": 8, "t": "Придумал вывести пленных под видом конвоя на ритуал и провёл колонну мимо трёх постов"}, {"ch": 8, "t": "Когда обман раскрыли, повернул копьё против своих и прикрывал спиной тех, кого вёл"}, {"ch": 9, "t": "Записался в городской управе и выучил правила жизни среди людей — от «не брать чужое» до «не принадлежу»"}, {"ch": 9, "t": "Сел на пол перед листами с крупными знаками и начал учить инфернальные буквы у Фронки"}, {"ch": 11, "t": "Передал Фронки прощальное письмо Георгоса, которое носили за пазухой не час и не два"}, {"ch": 12, "t": "С кучи щебня командовал рабочими у пролома в стене поместья: «Это туда, а ты туда, а ты сюда». О закрытии порта не слышал; Сандрии велел пойти поесть."}], "ties": [{"who": "Сандрия", "t": "Из-за неё он и перешёл: увидел свечение в темноте и решил, что этих держат ни за что"}, {"who": "Последний Дварф", "t": "Диктует ему правила и оставляет распоряжения на случай, если отряд не вернётся"}, {"who": "Фронки", "t": "Учит его буквам — «скоро будем писать на стенах»"}, {"who": "Госпожа Калиста", "t": "Служил у неё стражником и всю дорогу прикрывался её именем"}], "open": ["Что он сделает с комнатой Георгоса, которую тот завещал ему в письме", "Зачем ему три пары очков сразу"], "first": 8, "note": "В ранних главах его имя пишут «Шмык», в последней — «Шмыг»; полное имя записано в управе как Уби Пш-хэ.", "gal": [], "hero": null}, "r": {"card": "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "gallery": [{"src": "assets/img/characters/shmyg/shmyg-master-formal-sunglasses.webp", "cap": "Основной MASTER · формальный", "alt": "Шмыг. Основной референс идентичности. Одна пара солнечных очков, жёсткая манишка, полный рост.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "master"}, {"src": "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "width": 810, "height": 1080, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · ¾", "alt": "Портрет · ¾"}, {"src": "assets/img/characters/shmyg/shmyg-master-casual-straw-no-glasses.webp", "cap": "Дополнительный MASTER · шляпа без очков", "alt": "Шмыг. Тот же Шмыг в повседневной одежде, соломенной шляпе, с открытыми глазами.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/  положения ушей, ладонь и тыльная сторона кисти.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "detail"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-turnaround.webp", "cap": "Шляпа без очков · четыре стороны", "alt": "Шмыг. Исправленный лист: анфас, профиль влево, спина, профиль вправо.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-closeups.webp", "cap": "Шляпа без очков · разные крупности", "alt": "Шмыг. Поясной портрет, лицо, профиль, глаза и нос, ухо и плетение шляпы.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "detail"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-three-poses.webp", "cap": "Шляпа без очков · три позы", "alt": "Шмыг. Важный шаг, неподвижное слушание, быстрый настороженный разворот.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-six-emotions.webp", "cap": "Шляпа без очков · шесть эмоций", "alt": "Шмыг. Важность, подозрение, удивление; возмущение, радость, смущение.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "emotion"}, {"src": "assets/img/characters/shmyg/shmyg-scene-01-tunnel-guard.webp", "cap": "01 · Важный проход по тоннелю", "alt": "Шмыг. Один Шмыг-стражник в пустом тоннеле, с длинным копьём.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}, {"src": "assets/img/characters/shmyg/shmyg-scene-02-listening-towel.webp", "cap": "02 · Слушает голос за кадром", "alt": "Шмыг. Средний план: неподвижно слушает, белое полотенце через локоть.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}, {"src": "assets/img/characters/shmyg/shmyg-scene-03-registration.webp", "cap": "03 · Регистрация в управе", "alt": "Шмыг. Один Шмыг заполняет оставленные на столе бумаги.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}, {"src": "assets/img/characters/shmyg/shmyg-scene-04-infernal-letters.webp", "cap": "04 · Крупные инфернальные буквы", "alt": "Шмыг. Близкий план: учится писать, в соломенной шляпе без очков.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}, {"src": "assets/img/characters/shmyg/shmyg-scene-05-breakfast.webp", "cap": "05 · Завтрак, метла и сок", "alt": "Шмыг. Ростовой сюжет: накрывает стол, рядом метла и кувшин апельсинового сока.", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene"}], "credit": "Актуальный визуальный канон Шмыга · 19 иллюстраций", "approved": true, "completeCanon": true, "master": "assets/img/characters/shmyg/shmyg-master-formal-sunglasses.webp", "portrait3q": "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "dossier": ["assets/img/characters/shmyg/shmyg-master-formal-sunglasses.webp", "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "assets/img/characters/shmyg/shmyg-formal-front.webp", "assets/img/characters/shmyg/shmyg-master-casual-straw-no-glasses.webp", "assets/img/characters/shmyg/shmyg-casual-straw-sunglasses.webp", "assets/img/characters/shmyg/shmyg-hunting-hood-sunglasses.webp", "assets/img/characters/shmyg/shmyg-guard-ch08-spear.webp", "assets/img/characters/shmyg/shmyg-straw-no-glasses-three-poses.webp", "assets/img/characters/shmyg/shmyg-straw-no-glasses-six-emotions.webp"]}}, {"c": {"id": "port-priest", "name": "Священник портовой церкви", "kind": "npc", "line": "пожилой, борода до груди · церковь Килимвора", "tag": "нейтральный", "lede": "Старик, который пытался утихомирить пришедших в храм, взял серебряный, отступил перед глазами тифлинга — и сам открыл им ход в катакомбы.", "who": ["Поймал Джо за плечо и тут же отдёрнул руку. Спросил, зачем они шумят в храме, где люди пытаются найти покой. Два серебряных от Люциуса взял так, будто не понял, что это. Когда Георгос написал ему «Катакомбы», лицо у него изменилось, и он сказал: «Следуйте за мной».", "Сначала повёл не вниз, а к своей келье — и застыл перед вырванным замком. В стычке за бумаги из холодного камина вывернул Джо деревянную руку. Показал на шкаф: «Там раньше был проход, но его выложили камнем». Вышел и подпёр за отрядом дверь."], "look": ["Пожилой мужчина с бородой до груди, ряса вытерта на локтях", "Отступает на шаг и ещё на шаг, когда Люциус смотрит ему в глаза", "Сильнее, чем кажется: вырвал стопку бумаг из руки Джо"], "words": [{"q": "Зачем вы шумите в храме?", "ch": 12}, {"q": "Будьте тише. Здесь люди пытаются найти покой.", "ch": 12}, {"q": "Кто-то взломал мою келью.", "ch": 12}, {"q": "Катакомбы. Там были катакомбы.", "ch": 12}, {"q": "Я бы закрыл. Но там сломали замок.", "ch": 12}], "deeds": [{"ch": 11, "t": "Ходил между больными на ступенях, беседовал и осенял знамением; ему уступали дорогу"}, {"ch": 12, "t": "Не дал Люциусу разрушить алтарь"}, {"ch": 12, "t": "Открыл замурованный ход в катакомбы за шкафом в своей келье"}], "ties": [{"who": "Георгос", "t": "Единственный, кому старик отвечал без спора — по дощечке"}, {"who": "Джо", "t": "Вывернул ему деревянную руку, отбирая бумаги"}], "open": ["Знал ли он, что под его церковью держат людей и дракона", "Дошёл ли до него Джо с предупреждением"], "first": 11, "note": "Имени его хроника не называет. Настоятеля церкви зовут Берман — тот ли это человек, неясно: дневник лежал в келье, которую священник назвал своей.", "gal": [], "hero": null}, "r": {"approved": true, "completeCanon": true, "card": "assets/img/characters/port-priest/portrait.webp", "master": "assets/img/characters/port-priest/master.webp", "portrait3q": "assets/img/characters/port-priest/portrait.webp", "gallery": [{"src": "assets/img/characters/port-priest/master.webp", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "master", "cap": "Мастер · основной образ", "alt": "Мастер · основной образ"}, {"src": "assets/img/characters/port-prie        остальное — по первому появлению. На раскладку это не влияет: лист
       абсолютный и место под него зарезервировано разметкой. */
    if (global.IntersectionObserver && !near(el)) {
      var lazy = new IntersectionObserver(function (es) {
        if (!es.some(function (e) { return e.isIntersecting; })) return;
        lazy.disconnect();
        render();
      }, { rootMargin: '500px 0px' });
      lazy.observe(el);
      el.__lazy = lazy;
    } else render();

    if (global.ResizeObserver) {
      if (el.__ro) el.__ro.disconnect();
      el.__ro = new ResizeObserver(render);
      el.__ro.observe(el);
    } else {
      global.addEventListener('resize', render);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(render).catch(function () {});
    return svg;
  }

  /* ==================================================== FIELD · ЖИВОЕ ПОЛЕ
     Слой на весь экран за содержимым: медленно дрейфующие туманности,
     крупное зерно поверх, парящие сферы и искры с параллаксом.
     Цвет ведёт раздел: кобальт / фиолет / глубокая синь / роза / тёплый / слива.
     Бюджет: не больше 60 частиц, один rAF, при reduced-motion — статичный кадр. */

  var FIELD_HUES = {
    cobalt: { neb: ['#2c3ea3', '#3a4fbe', '#5f79df'], warm: '#f4642c', spark: '#a9baf4' },
    violet: { neb: ['#6b3f84', '#8c5d9e', '#a873b8'], warm: '#f4642c', spark: '#e9c2ee' },
    sea:    { neb: ['#16204d', '#21306b', '#2c3ea3'], warm: '#c8410f', spark: '#7f95dd' },
    rose:   { neb: ['#6d4351', '#9f7285', '#d78ba9'], warm: '#f4642c', spark: '#f2bdd2' },
    ember:  { neb: ['#7a2f12', '#c8410f', '#9f7285'], warm: '#f4642c', spark: '#ffc78f' },
    plum:   { neb: ['#3f2350', '#5b2f6e', '#8c5d9e'], warm: '#c8410f', spark: '#d9a9e6' },
    night:  { neb: ['#150f36', '#2b2168', '#3a4fbe'], warm: '#c8410f', spark: '#a9baf4' }
  };

  function hex2rgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgbaStr(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }

  var FIELD_MAX = 60;

  /* ---------------------------------------------------------- РЕЕСТР ПОЛЕЙ
     Каждое поле держит свой rAF. Когда разделов на странице несколько
     (однофайловая сборка), кадры скрытых полей — чистая потеря: холст не
     виден, а работа идёт. Поэтому:
       · поле само гаснет, когда его холст ушёл из кадра (IntersectionObserver)
         или вкладка ушла в фон (visibilitychange) — это работает и в
         многофайловом виде, без всякого роутера;
       · роутер может сказать прямо: ENGINE.fields.only(корень активного
         раздела) — остановить все, кроме тех, что внутри корня.
     Ручной stop() всегда сильнее автоматики: разбуженным считается только
     то поле, которое никто не выключал руками. */
  var FIELD_REG = [];
  var FIELD_IO = null;

  function fieldsIO() {
    if (FIELD_IO || !global.IntersectionObserver) return FIELD_IO;
    FIELD_IO = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var f = e.target.__field;
        if (f) f.__see(e.isIntersecting);
      });
    }, { rootMargin: '80px' });
    return FIELD_IO;
  }

  function fieldsAwake() {
    var n = 0;
    for (var i = 0; i < FIELD_REG.length; i++) if (FIELD_REG[i].running) n++;
    return n;
  }
  /* оставить живыми только поля внутри root (или с холстом === root) */
  function fieldsOnly(root) {
    if (typeof root === 'string') root = document.querySelector(root);
    FIELD_REG.forEach(function (f) {
      var inside = !!root && (f.canvas === root || root.contains(f.canvas));
      f.__wanted(inside);
    });
  }
  function fieldsStopAll() { FIELD_REG.forEach(function (f) { f.__wanted(false); }); }

  if (typeof document !== 'undefined') {
    document.addEventListener('visibilitychange', function () {
      var hid = document.visibilityState === 'hidden';
      FIELD_REG.forEach(function (f) { f.__tab(!hid); });
    });
  }

  function field(canvas, opts) {
    if (typeof canvas === 'string') canvas = document.querySelector(canvas);
    if (!canvas || !canvas.getContext) return null;
    if (canvas.__field) return canvas.__field;     /* второй раз то же поле не заводим */
    opts = opts || {};

    var ctx = canvas.getContext('2d', { alpha: true });
    var mq = global.matchMedia ? global.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    var reduced = !!mq.matches;

    var CNT = Math.min(FIELD_MAX, Math.max(0, opts.count === undefined ? 46 : opts.count));
    var NEB = Math.max(3, Math.min(9, opts.nebulae === undefined ? 7 : opts.nebulae));
    var GRAIN_A = opts.grain === undefined ? 0.15 : opts.grain;
    /* Параллакс по прокрутке убран намеренно. Поле рисуется тридцать кадров
       в секунду, а страница прокручивается шестьюдесятью, на ноутбуках Apple —
       ста двадцатью. Фон, привязанный к прокрутке, отставал и шёл ступеньками
       относительно текста: именно это и читалось как «фон мигает и скачет».
       Неподвижный при прокрутке фон — то, чем фон и должен быть. */
    var PARA = opts.parallax === undefined ? 0 : opts.parallax;
    var PMARG = 0.09;                      /* запас за кромкой, доля экрана */
    var SPEED = opts.speed === undefined ? 1 : opts.speed;
    var sections = opts.sections || [];

    var W = 0, H = 0, DPR = 1;
    var buf = document.createElementNS ? document.createElement('canvas') : null;
    var bctx = buf.getContext('2d');
    var BS = 0.20;                              /* туманности рисуем в 1/5 разрешения */
    var bw = 0, bh = 0;

    var cur = hueTriple(opts.hue || 'cobalt');
    var target = cur.map(function (c) { return c.slice(); });

    function hueTriple(name) {
      var h = FIELD_HUES[name] || FIELD_HUES.cobalt;
      return [hex2rgb(h.neb[0]), hex2rgb(h.neb[1]), hex2rgb(h.neb[2]), hex2rgb(h.warm), hex2rgb(h.spark)];
    }

    /* ---- туманности ---- */
    var nebs = [];
    function buildNebs() {
      var rnd = rng(20260901);
      nebs = [];
      for (var i = 0; i < NEB; i++) {
        nebs.push({
          x: rnd(), y: rnd(),
          r: 0.34 + rnd() * 0.44,
          dx: (0.5 + rnd()) * 0.000028 * SPEED,   /* угловые скорости маятника, рад/мс */
          dy: (0.5 + rnd()) * 0.000021 * SPEED,
          ph: rnd() * TAU,
          sp: 0.00012 + rnd() * 0.00016,
          k: i % 3,                              /* какой из трёх цветов */
          warm: i === NEB - 1,                   /* редкий оранжевый */
          a: 0.30 + rnd() * 0.26
        });
      }
    }

    /* ---- частицы: сферы и искры ---- */
    var parts = [];
    function buildParts() {
      var rnd = rng(770123);
      parts = [];
      for (var i = 0; i < CNT; i++) {
        var isSpark = rnd() > 0.62;
        parts.push({
          x: rnd(), y: rnd(),
          r: isSpark ? 1.4 + rnd() * 3.4 : 2.2 + rnd() * 9.5,
          d: 0.25 + rnd() * 0.95,                /* глубина → параллакс и скорость */
          vx: (rnd() - 0.5) * 0.00013 * SPEED,
          vy: -(0.00004 + rnd() * 0.00011) * SPEED,
          ph: rnd() * TAU,
          tw: 0.5 + rnd() * 1.6,
          spark: isSpark,
          kind: rnd()
        });
      }
    }

    /* ---- спрайты: рисуем градиент один раз, потом только drawImage ---- */
    var sprites = {};
    function sprite(key, size, paint) {
      var k = key + '@' + size;
      if (sprites[k]) return sprites[k];
      var c = document.createElement('canvas');
      c.width = c.height = size;
      paint(c.getContext('2d'), size);
      sprites[k] = c;
      return c;
    }
    function orbSprite(rgb, size) {
      return sprite('orb' + rgb.join(','), size, function (g, s) {
        var h = s / 2;
        var gr = g.createRadialGradient(h * 0.68, h * 0.62, 0, h, h, h);
        gr.addColorStop(0, 'rgba(255,255,255,.92)');
        gr.addColorStop(0.22, rgbaStr(rgb, 0.95));
        gr.addColorStop(0.62, rgbaStr(mixRGB(rgb, [0, 0, 0], 0.45), 0.72));
        gr.addColorStop(1, rgbaStr(mixRGB(rgb, [0, 0, 0], 0.8), 0));
        g.fillStyle = gr;
        g.beginPath(); g.arc(h, h, h, 0, TAU); g.fill();
        /* дуга отражённого света снизу справа */
        g.strokeStyle = rgbaStr(mixRGB(rgb, [255, 255, 255], 0.7), 0.42);
        g.lineWidth = Math.max(1, s * 0.06);
        g.beginPath(); g.arc(h, h, h * 0.80, rad(16), rad(124)); g.stroke();
      });
    }
    function sparkSprite(rgb, size) {
      return sprite('spk' + rgb.join(','), size, function (g, s) {
        var h = s / 2;
        var gr = g.createRadialGradient(h, h, 0, h, h, h);
        gr.addColorStop(0, 'rgba(255,255,255,.95)');
        gr.addColorStop(0.30, rgbaStr(rgb, 0.65));
        gr.addColorStop(1, rgbaStr(rgb, 0));
        g.fillStyle = gr; g.fillRect(0, 0, s, s);
        g.fillStyle = rgbaStr(mixRGB(rgb, [255, 255, 255], 0.6), 0.9);
        g.beginPath();
        var r = h * 0.92, K = r * 0.13;
        g.moveTo(h, h - r);
        g.quadraticCurveTo(h + K, h - K, h + r, h);
        g.quadraticCurveTo(h + K, h + K, h, h + r);
        g.quadraticCurveTo(h - K, h + K, h - r, h);
        g.quadraticCurveTo(h - K, h - K, h, h - r);
        g.fill();
      });
    }

    /* ---- зерно: слой печём один раз ----
       Плитка кладётся альфа-шумом (светлое/тёмное с прозрачностью), затем
       разворачивается в экранный холст. В кадре остаётся один drawImage
       поверх — вместо полноэкранной заливки с режимом overlay, которая
       на 1440 съедает больше кадрового бюджета, чем весь остальной фон. */
    var grainLayer = null, GT = 128;
    function buildGrain() {
      var c = document.createElement('canvas');
      c.width = c.height = GT;
      var g = c.getContext('2d');
      var img = g.createImageData(GT, GT), dt = img.data, rnd = rng(9091);
      for (var i = 0; i < dt.length; i += 4) {
        /* усиление контраста как feFunc slope ~2.1 — иначе шум серый */
        var v = Math.min(1, Math.max(0, (rnd() - 0.5) * 2.1 + 0.5));
        var lit = v > 0.5;
        dt[i] = dt[i + 1] = dt[i + 2] = lit ? 255 : 0;
        dt[i + 3] = Math.round(Math.abs(v - 0.5) * 2 * 255);
      }
      g.putImageData(img, 0, 0);
      grainLayer = document.createElement('canvas');
      grainLayer.width = W + GT; grainLayer.height = H + GT;
      var lg = grainLayer.getContext('2d');
      lg.fillStyle = lg.createPattern(c, 'repeat');
      lg.fillRect(0, 0, W + GT, H + GT);
    }

    function resize() {
      var r = canvas.getBoundingClientRect();
      W = Math.max(1, Math.round(r.width || global.innerWidth));
      H = Math.max(1, Math.round(r.height || global.innerHeight));
      /* Пишем пиксель в пиксель: уменьшенный холст браузер потом растягивает,
         и пересэмплирование обходится дороже, чем сэкономленные пиксели
         (замерено: 0.62 от экрана — минус одиннадцать кадров). */
      DPR = Math.min(1.5, global.devicePixelRatio || 1);
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      bw = Math.max(2, Math.round(W * BS));
      bh = Math.max(2, Math.round(H * BS));
      buf.width = bw; buf.height = bh;
      buildGrain();
    }

    /* ---- какой раздел сейчас в кадре ---- */
    var hueName = opts.hue || 'cobalt';
    function pickHue() {
      if (!sections.length) return;
      var mid = global.innerHeight * 0.42, best = null, bestD = 1e9;
      for (var i = 0; i < sections.length; i++) {
        var s = sections[i];
        var el = s.el || (s.sel ? document.querySelector(s.sel) : null);
        if (!el) continue;
        var b = el.getBoundingClientRect();
        if (b.bottom < 0 || b.top > global.innerHeight) continue;
        var d = Math.abs((b.top + b.bottom) / 2 - mid);
        if (b.top <= mid && b.bottom >= mid) d = -1;
        if (d < bestD) { bestD = d; best = s.hue; }
      }
      if (best && best !== hueName) { hueName = best; target = hueTriple(best); }
    }
    function setHue(name) { if (FIELD_HUES[name]) { hueName = name; target = hueTriple(name); } }

    var t0 = performance.now(), last = t0, fpsAcc = 0, fpsN = 0, fpsT = t0;
    var raf = 0, running = false, scrollY = 0;
    var api;

    function drawNebulae(t) {
      bctx.globalCompositeOperation = 'source-over';
      bctx.fillStyle = '#0d0b26';
      bctx.fillRect(0, 0, bw, bh);
      bctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < nebs.length; i++) {
        var n = nebs[i];
        /* Туманность НЕ замыкается по краю. Радиус у неё до половины экрана,
           и линейный дрейф с «% 1» переносил её на другую сторону за один
           кадр: треть экрана разом меняла яркость, потом обратно. На записи
           это выглядело как ровный стук — каждые две-три секунды. Теперь дрейф
           маятниковый: туманность уходит на десятую долю экрана и возвращается,
           нигде не рвясь. */
        var x = n.x + Math.sin(t * n.dx + n.ph * 1.7) * 0.11 + Math.sin(t * n.sp + n.ph) * 0.05;
        var y = n.y + Math.cos(t * n.dy + n.ph * 2.3) * 0.09 + Math.cos(t * n.sp * 0.83 + n.ph) * 0.045;
        var px = x * bw, py = y * bh, pr = n.r * Math.max(bw, bh) * 0.72;
        var col = n.warm ? cur[3] : cur[n.k];
        var a = n.a * (n.warm ? 0.42 : 1) * (0.82 + 0.18 * Math.sin(t * n.sp * 1.7 + n.ph));
        var g = bctx.createRadialGradient(px, py, 0, px, py, pr);
        g.addColorStop(0, rgbaStr(col, a * 0.85));
        g.addColorStop(0.45, rgbaStr(col, a * 0.34));
        g.addColorStop(1, rgbaStr(col, 0));
        bctx.fillStyle = g;
        bctx.beginPath(); bctx.arc(px, py, pr, 0, TAU); bctx.fill();
      }
      bctx.globalCompositeOperation = 'source-over';
    }

    /* Кадры поля отдельно от кадров страницы. Туманности дрейфуют со скоростью
       порядка 0.00003 экрана за миллисекунду — тридцати кадров в секунду им
       хватает с запасом, а страница остаётся на своих шестидесяти. */
    var FPS_CAP = opts.maxFps === undefined ? 40 : opts.maxFps;
    var minGap = FPS_CAP > 0 ? 1000 / FPS_CAP - 1.5 : 0;
    var drawnAt = -1e9;

    function frame(now) {
      if (running && minGap && now - drawnAt < minGap) { raf = requestAnimationFrame(frame); return; }
      drawnAt = now;
      var t = now - t0;
      /* плавный переход цвета раздела */
      for (var i = 0; i < cur.length; i++) cur[i] = mixRGB(cur[i], target[i], 0.02);

      drawNebulae(t);

      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'low';
      ctx.drawImage(buf, 0, 0, bw, bh, 0, 0, W, H);

      /* частицы с параллаксом */
      ctx.globalCompositeOperation = 'lighter';
      for (i = 0; i < parts.length; i++) {
        var p = parts[i];
        var px = ((p.x + p.vx * t) % 1 + 1) % 1;
        var py = ((p.y + p.vy * t - (scrollY / Math.max(1, document.documentElement.scrollHeight)) * PARA * p.d) % 1 + 1) % 1;
        /* Круг замыкания растянут за края экрана: частица уходит из кадра
           ДО того, как перескочит на другую сторону. Раньше замыкание
           происходило ровно по кромке — при прокрутке десятки огоньков
           разом гасли на одном краю и вспыхивали на другом. Это и было
           мигание фона: не яркость менялась, а точки телепортировались. */
        var X = (px * (1 + 2 * PMARG) - PMARG) * W;
        var Y = (py * (1 + 2 * PMARG) - PMARG) * H;
        /* Мерцание было от 0.10 до 1.00 — не мерцание, а моргание: сорок
           огоньков гасли почти в ноль и вспыхивали обратно, каждый в свою
           фазу. Оставляем дыхание, а не морзянку, и вдвое медленнее. */
        var tw = 0.74 + 0.26 * Math.sin(t * 0.00032 * p.tw + p.ph);
        var rr = p.r * (0.6 + p.d * 0.8);
        var col = p.spark ? cur[4] : (p.kind > 0.72 ? cur[3] : cur[p.kind > 0.4 ? 2 : 1]);
        var sz = Math.max(4, Math.round(rr * 2));
        var img = p.spark ? sparkSprite(col, 32) : orbSprite(col, 48);
        ctx.globalAlpha = (p.spark ? 0.62 : 0.50) * tw;
        ctx.drawImage(img, X - sz / 2, Y - sz / 2, sz, sz);
      }
      ctx.globalAlpha = 1;

      /* крупное зерно поверх — один blit, без режима смешивания */
      if (grainLayer && GRAIN_A > 0) {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = GRAIN_A;
        var jx = (t * 0.004) % GT | 0, jy = (t * 0.003) % GT | 0;
        ctx.drawImage(grainLayer, -jx, -jy);
        ctx.globalAlpha = 1;
      }

      /* fps */
      var dt = now - last; last = now;
      if (dt > 0) { fpsAcc += 1000 / dt; fpsN++; }
      if (now - fpsT > 1000) {
        api.fps = Math.round(fpsAcc / Math.max(1, fpsN));
        fpsAcc = 0; fpsN = 0; fpsT = now;
        if (opts.onFps) opts.onFps(api.fps);
      }
      if (running) raf = requestAnimationFrame(frame);
    }

    function onScroll() {
      if (!running) return;                       /* спящее поле не считает оттенок */
      scrollY = global.scrollY || global.pageYOffset || 0; pickHue();
    }

    /* три заслонки: рука, видимость холста, состояние вкладки */
    var gWant = true, gSee = true, gTab = true;
    function apply() {
      var on = gWant && gSee && gTab && !reduced;
      if (on === running) return;
      if (on) {
        running = true; last = performance.now(); t0 = performance.now() - (last - t0);
        scrollY = global.scrollY || global.pageYOffset || 0;
        raf = requestAnimationFrame(frame);
      } else {
        running = false; if (raf) cancelAnimationFrame(raf); raf = 0;
      }
    }
    function start() { gWant = true; apply(); }
    function stop() { gWant = false; apply(); }
    function destroy() {
      gWant = false; apply();
      var k = FIELD_REG.indexOf(api); if (k >= 0) FIELD_REG.splice(k, 1);
      if (FIELD_IO) FIELD_IO.unobserve(canvas);
      canvas.__field = null;
      global.removeEventListener('resize', onResize);
      global.removeEventListener('scroll', onScroll);
      if (mq.removeEventListener) mq.removeEventListener('change', onMQ);
    }
    /* холст скрытого раздела имеет нулевую коробку — пересчитывать нечего,
       иначе он схлопнется в 1×1 и при возврате покажет мыло */
    function onResize() {
      if (!canvas.isConnected) return;
      var r = canvas.getBoundingClientRect();
      if (!r.width || !r.height) return;
      resize(); if (reduced) frame(performance.now());
    }
    function onMQ() {
      reduced = !!mq.matches;
      if (reduced) { apply(); frame(performance.now()); } else apply();
    }

    resize(); buildNebs(); buildParts(); onScroll();
    global.addEventListener('resize', onResize, { passive: true });
    global.addEventListener('scroll', onScroll, { passive: true });
    if (mq.addEventListener) mq.addEventListener('change', onMQ);

    api = {
      fps: 0, reduced: reduced, particles: parts.length, nebulae: nebs.length,
      canvas: canvas,
      start: start, stop: stop, destroy: destroy, resize: onResize, setHue: setHue,
      get running() { return running; },
      get hue() { return hueName; },
      /* внутреннее: заслонки роутера, наблюдателя и вкладки */
      __wanted: function (v) { gWant = !!v; if (v) onResize(); apply(); },
      __see: function (v) { gSee = !!v; if (v) onResize(); apply(); },
      __tab: function (v) { gTab = !!v; apply(); }
    };

    canvas.__field = api;
    FIELD_REG.push(api);
    var io = fieldsIO();
