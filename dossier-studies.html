</style></head><body><header class="workbench"><div class="topline"><a href="./#/lica">← К персонажам</a><span>Жребий · мастерская</span></div><h1>Три облика досье</h1><p>Отдельные эскизы. Выберите композицию и персонажа, чтобы сравнить подачу.</p><nav class="controls" aria-label="Варианты оформления"><button data-mode="archive" aria-pressed="true">01 · Архив</button><button data-mode="chronicle" aria-pressed="false">02 · Хроника</button><button data-mode="cabinet" aria-pressed="false">03 · Кабинет</button><label for="character">Персонаж</label><select id="character"><option value="0">Люциус</option><option value="1">Шмыг</option><option value="2">Портовый священник</option></select></nav></header><p class="intro" id="direction" aria-live="polite"></p><main id="sample" class="sample archive"></main><dialog id="zoom"><button type="button" id="closeZoom">Закрыть ×</button><img alt=""><p></p></dialog><script id="study-data" type="application/json">[{"c": {"id": "samik", "player": "Самик", "line": "тифлинг · паладин, преступивший клятву", "lede": "Шулер, который передёргивает карту, торгуется за лишнюю монету и на вопрос о друзьях каждый раз ровно отвечает «нет». И каждый раз оказывается тем, кто снял с плеч плащ.", "who": ["Первая реплика у него всегда язвительная, вторая — по делу; на вопрос он охотнее отвечает вопросом. Деньги считает вслух и требует свою долю даже там, где доля ему не нужна. На прямой вопрос, есть ли у него друзья, отвечает «нет» ровным голосом и отвечает так каждый раз, сколько бы раз ни спрашивали.", "Помогает он всегда с оговоркой. В запечатанном склепе, где нечем дышать, ползёт к задыхающемуся и подтягивает его голову к самому камню, где ещё осталось холодное. Прикованной девушке молча отдаёт свой плащ красной подкладкой к телу и вынимает шпильку из оковы кончиком ножа. Целую камеру лечит со связанными за спиной руками — и добавляет, что так ему было удобнее.", "Молится он на языке, в котором просьб нет вовсе: слова этого языка рассчитаны на сделку, и он выговаривает их медленно, как выговаривают условия. Лечит тем же низким шёпотом, и раненые встают. Себя он при этом объясняет корыстью или удобством — чтобы никто не принял его за доброго.", "К последним главам шуток в его речи меньше, а цена решений выше. Он добивает сдавшегося рыцаря, рассчитав, что демоны привязаны к нему и уйдут; демоны не уходят, и он признаёт это вслух, двумя словами. Потом выходит на открытое место под арбалетами и волочит за шкирку однорукого попутчика, которого знает полдня, крича ему в ухо, что тот слишком молод умирать неестественной смертью."], "look": ["красноватая кожа: в темноте похоже на загар, на свету явно красная", "жёлтые светящиеся глаза — в темноте по ним видно, как он моргает", "длинные кудрявые чёрные волосы", "рога средней длины, изогнутые вверх", "длинный хвост, выходящий из-под плаща; в разговоре лежит неподвижно вдоль ноги", "чёрный плащ с красной подкладкой — по ней видно, где он ранен", "знак на цепочке поверх плаща", "дерзкая ухмылка, которая в плохие минуты становится шире обычного"], "gift": [{"t": "Исцеление инфернальным шёпотом", "d": "Говорит низко и не по-человечески, слова идут не из горла, а откуда-то из-под него. У старушки разглаживаются морщины, у девушки затягивается ссадина, умирающий открывает глаза. Ему для этого не нужны ни свободные руки, ни свет."}, {"t": "Молитва как сделка", "d": "Язык, на котором он молится, не приспособлен просить — только договариваться. Он раскладывает перед собой всё, что у него есть, и выговаривает условия. Иногда ему не отвечают вовсе: ни отказа, ни знака, ни холода, ни тепла."}, {"t": "Оружие, которого нет", "d": "Может призвать себе оружие из воздуха и вести его на расстоянии, не касаясь. Оно облетает и бьёт само."}, {"t": "Четверо без лиц и трое себя", "d": "Умеет поставить вокруг себя четыре фигуры, сотканные из белого и красного разом: они не бьют и не двигаются, но всякий, кто входит в круг, идёт всё медленнее, а потом перестаёт идти. И умеет выпустить из ладони троих себя — одинаковых, в одинаковых плащах, с одинаковой ухмылкой, — сквозь которых стрелы проходят насквозь."}, {"t": "Видит, что перед ним", "d": "Нежить он различает иначе, чем демонов, и говорит об этом без ухмылки — по одному этому остальные всё понимают. Однажды он менял облик на женский; облик держался час, а конкурс шёл два."}], "words": [{"q": "Ниже. Пол — твой друг.", "ch": 2, "when": "в запечатанном склепе, задыхающемуся Вергелию"}, {"q": "Я много чего беру без спроса. Прикованное — нет.", "ch": 3, "when": "за занавесью в Аллее Масок, накрыв прикованную девушку своим плащом"}, {"q": "Не благодарите. Мне так было удобнее.", "ch": 8, "when": "в гоблинской камере, вылечив всех со связанными за спиной руками"}, {"q": "Он на коленях, а они нет.", "ch": 10, "when": "после того, как добил сдавшегося рыцаря и демоны не ушли"}, {"q": "Говорят, очень жестоко было. Хотя я сам видел. Было очень жестоко.", "ch": 11, "when": "за завтраком, глядя в стакан сока"}, {"q": "Это война, Джо! Это война! Ты не живёшь, Джо! Джо, живи!", "ch": 11, "when": "волоча Джо из-под арбалетов у городской стены"}, {"q": "Джо, ты мой лучший друг теперь.", "ch": 12, "when": "по дороге к церкви, обнимая Джо за плечо"}, {"q": "Я развожусь с обманом. Ради тебя, Джо.", "ch": 12, "when": "над мёртвым Джо, снимая кольцо"}, {"q": "Ну, мы зато теперь знаем, как работает огненный шар. Не понаслышке.", "ch": 12, "when": "в коридоре, без бровей"}, {"q": "Пидорасы! Эти суки стоят в центре!", "ch": 12, "when": "встав с пола, в сторону горящей двери"}], "deeds": [{"ch": 2, "t": "В склепе с ядовитым газом дополз до задыхающегося шифтера и подтянул его голову к самому камню, где у пола ещё оставалось холодное."}, {"ch": 3, "t": "Накрыл прикованную девушку своим плащом, красной подкладкой к телу, и вынул шпильку из оковы кончиком ножа. Плащ велел оставить себе."}, {"ch": 4, "t": "Ради победы на деревенском конкурсе красоты стал женщиной. Облик кончился на час раньше конкурса, прямо на сцене, и спасать положение пришлось импровизированной исповедью про паладинов, проклятие и хвост."}, {"ch": 6, "t": "Ночью, пока паладин спал после боя с оборотнем, разрисовал его углём, золой и гримом: подведённые глаза, губы, родинка и сердечко с подписью на доспехе."}, {"ch": 8, "t": "В гоблинской камере выплюнул кляп и с руками за спиной вылечил всех сокамерников шёпотом — и сразу объяснил это удобством."}, {"ch": 10, "t": "Добил стоящего на коленях рыцаря одним точным ударом снизу вверх, рассчитав, что демоны привязаны к нему. Демоны остались. Он сказал «я ошибся» и стал снимать с мёртвого всё по очереди."}, {"ch": 11, "t": "Вышел на простреливаемое место и вытащил за шкирку Джо, которому болтом прибило руку к гитаре, — и всю дорогу орал ему в ухо, что тот не умрёт."}, {"ch": 11, "t": "В закутке за стеной дома разложил перед собой всё, что у него было, и выговаривал условия сделки, чтобы переселить умирающего Джо в тело ушедшего паладина. Ответа не пришло никакого: ни отказа, ни знака."}, {"ch": 12, "t": "Обнял Джо за плечо, нащупал фурункул на шее и не убрал руку; пообещал лучший бордель и благословил на своём языке."}, {"ch": 12, "t": "Дважды ударил булавой в замурованную стену кельи — оба удара посвятил Джо; за стеной открылись ступени в катакомбы."}, {"ch": 12, "t": "Когда Джо умер в третьей клетке, снял кольцо за шестьсот золотых, положил ему на грудь и заговорил в полный голос на инфернальном. Камень раскололся, Джо встал. «Я развожусь с обманом. Ради тебя, Джо»."}, {"ch": 12, "t": "Принял огненный шар в полный рост в дверном проёме, упал под щупальцем твари, лежал между двумя горящими дверями, «притворившись мёртвым», — и встал сам. Заорал своим, где враги: «Эти суки стоят в центре!»"}, {"ch": 12, "t": "Дошёл по льду до ученика мага, положил ладонь ему на грудь, и оба легли в обнимку."}], "ties": [{"who": "Георгос", "t": "Спорят с первой главы и не перестают. Паладин однажды поднял его с пола, когда меч прошёл ему поперёк спины. В прощальном письме Георгос просит развеять его прах — и развеивать должен именно Люциус."}, {"who": "Последний Дварф", "t": "Когда Люциус пропал, Дварф понял это по невзятой доле и пошёл искать его по Улице Борделей, потому что там его знали лучше."}, {"who": "Сандрия", "t": "Знакомы ещё до плена. Он подшучивает над её виноградным соком и тут же разворачивает её к стойке, когда нужно, чтобы говорила она."}, {"who": "Джо", "t": "Однорукий прохожий, которого он знает полдня. Люциус вытаскивает его из-под болтов, оскорбляет всю дорогу, пытается вылечить руками — и торгуется за его душу на инфернальном."}, {"who": "Джо", "t": "Лучший друг с одной ночи. Люциус воскресил его ценой кольца, а Джо после этого перестал узнавать его лицо — и всё равно погладил по затылку."}], "open": ["Отслеживающая булавка Приветствующих утрачена: она осталась на куртке, которую бросили на полу.", "Он взялся вылечить Джо — и не смог: под пальцами лопнули корки, и он убрал руки. Молитва о его переселении осталась без ответа.", "Георгос попросил развеять его прах на вершине горы Олимпия, с двумя условиями: ветер в лицо и развеивать должен Люциус. Просьба не закрыта.", "Мальчик-тифлинг из детского лазарета «удивительно похож» на него — тот же тяжёлый нос. Фронки заметил и не сказал.", "Кольцо за шестьсот золотых истрачено: камень расколот на груди Джо."], "note": "Единственный персонаж, чью внешность игрок описал текстом целиком, — почти готовый визуальный паспорт. В ранних записях его называют жрецом, дальше — паладином, преступившим клятву; в четвёртой главе к нему всё ещё обращаются «жрец». Отдельный узел канона: в одной из аудиозаписей тело Люциуса путают с телом отца Лютера — в книге это два разных человека.", "hero": "lucius-romance", "gal": ["s04-tower-rats", "xx-fallen-2", "s06-camp-ritual", "xx-tax-office"], "kind": "pc", "name": "Люциус", "tag": "отряд", "first": 2}, "r": {"approved": true, "completeCanon": true, "card": "assets/img/characters/lucius/lucius-face-front.webp", "master": "assets/img/characters/lucius/lucius-base-master.webp", "portrait3q": "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "gallery": [{"src": "assets/img/characters/lucius/lucius-base-master.webp", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "master", "cap": "Мастер · ¾", "alt": "Мастер · ¾"}, {"src": "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · ¾", "alt": "Портрет · ¾"}, {"src": "assets/img/characters/lucius/lucius-face-front.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · анфас", "alt": "Портрет · анфас"}, {"src": "assets/img/characters/lucius/lucius-front.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "full", "cap": "В полный рост", "alt": "В полный рост"}, {"src": "assets/img/characters/lucius/lucius-profile.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Профиль", "alt": "Профиль"}, {"src": "assets/img/characters/lucius/lucius-back.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Со спины", "alt": "Со спины"}, {"src": "assets/img/characters/lucius/lucius-hands.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "detail", "cap": "Кисти и украшения", "alt": "Кисти и украшения"}, {"src": "assets/img/characters/lucius/lucius-pose-1.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Рассматривает находку", "alt": "Рассматривает находку"}, {"src": "assets/img/characters/lucius/lucius-pose-2.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Боевая стойка", "alt": "Боевая стойка"}, {"src": "assets/img/characters/lucius/lucius-pose-3.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "pose", "cap": "Магия", "alt": "Магия"}, {"src": "assets/img/characters/lucius/lucius-face-profile.webp", "width": 840, "height": 1112, "fit": "contain", "canon": true, "role": "angle", "cap": "Лицо · профиль", "alt": "Лицо · профиль"}, {"src": "assets/img/characters/lucius/lucius-scene-01.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 01", "alt": "Сюжет · 01"}, {"src": "assets/img/characters/lucius/lucius-scene-02.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 02", "alt": "Сюжет · 02"}, {"src": "assets/img/characters/lucius/lucius-scene-03.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 03", "alt": "Сюжет · 03"}, {"src": "assets/img/characters/lucius/lucius-scene-04.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 04", "alt": "Сюжет · 04"}, {"src": "assets/img/characters/lucius/lucius-scene-05.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 05", "alt": "Сюжет · 05"}, {"src": "assets/img/characters/lucius/lucius-scene-06.webp", "width": 1536, "height": 1024, "fit": "contain", "canon": false, "role": "scene", "cap": "Сюжет · 06", "alt": "Сюжет · 06"}, {"src": "assets/img/characters/lucius/lucius-sheet.webp", "width": 3600, "height": 2400, "fit": "contain", "canon": true, "role": "sheet", "cap": "Сводный канонический лист", "alt": "Сводный канонический лист"}, {"src": "assets/img/characters/lucius/lucius-details-poses.webp", "width": 3600, "height": 2400, "fit": "contain", "canon": true, "role": "sheet", "cap": "Сводный канонический лист", "alt": "Сводный канонический лист"}], "credit": "Утверждённый канон · полный пакет", "dossier": ["assets/img/characters/lucius/lucius-base-master.webp", "assets/img/characters/lucius/lucius-portrait-three-quarter.webp", "assets/img/characters/lucius/lucius-front.webp", "assets/img/characters/lucius/lucius-pose-1.webp", "assets/img/characters/lucius/lucius-pose-2.webp", "assets/img/characters/lucius/lucius-pose-3.webp"]}}, {"c": {"id": "shmyg", "name": "Шмыг", "kind": "npc", "line": "гоблин · при отряде", "tag": "союзник", "lede": "Гоблин-стражник, который однажды заглянул в чужую камеру и решил, что держат там людей совершенно зря.", "who": ["Он служил у Госпожи и ходил в дозоры, из которых возвращался один. Везение он считал профессией: все, с кем он ходил, уже мертвы, а он стоит. В темноте камеры он увидел светящиеся кончики волос фирболга, поздоровался — и в ту же секунду перестал быть тюремщиком. Развязал верёвку, повёл пленных как конвой и по дороге ни разу не сбился.", "Когда шаман поймал его на лжи, Шмыг опустил копьё остриём вперёд — не на шамана, а на своих, — и пятился так, чтобы оставаться между сталью и теми, кто стоял у него за спиной. С тех пор он при отряде. В городской управе его записали как положено, а Последний Дварф на ступенях управы продиктовал ему правила: не брать чужое, не бежать, если человек кричит, и отвечать «состою», а не «принадлежу».", "Дальше он живёт в доме: учит буквы, водит серого лохматого пони, носит на груди щенка мастифа, который тяжелее его самого, и накрывает завтрак с полотенцем через локоть. Ему оставили распоряжения на случай, если отряд не вернётся: найти тела, отвезти к Седрику, приглядеть за пони и щенком, читать не бросать."], "look": ["Зелёная голова, уши, которые дрогнули раньше, чем он придумал ответ", "Копьё стражника и выпяченная грудь — вид человека, на котором держится весь подземный порядок", "Три пары очков с закопчёнными стёклами разом: одни на глазах, вторые задраны на лоб, третьи на затылке стёклами назад", "Три комплекта одежды: формальный с жёсткой манишкой, повседневный просторный и охотничий, капюшон которого налезает на глаза", "Щенок мастифа на груди и серый лохматый пони под собой", "Полотенце через локоть, метла у двери — и апельсиновый сок, поставленный на самый свет"], "words": [{"q": "Меня, знаешь, ни разу не убили. Ни разу. Все, с кем я в дозор ходил, — уже нет, а я вот стою.", "ch": 8}, {"q": "Скажу — веду на ритуал, приказ Госпожи. Никто не спросит, при её имени никто ничего не спрашивает.", "ch": 8}, {"q": "Именем Госпожи. Хорошее имя. Рабочее.", "ch": 8}, {"q": "Сэр Георгос просил передать вам.", "ch": 11}, {"q": "Госпожа! Здравствуйте! Вас не было достаточно долго.", "ch": 12}, {"q": "Поешь сходи.", "ch": 12}], "deeds": [{"ch": 8, "t": "Просунул руку между прутьев и развязал Люциуса, потому что Сандрия попросила вежливо"}, {"ch": 8, "t": "Придумал вывести пленных под видом конвоя на ритуал и провёл колонну мимо трёх постов"}, {"ch": 8, "t": "Когда обман раскрыли, повернул копьё против своих и прикрывал спиной тех, кого вёл"}, {"ch": 9, "t": "Записался в городской управе и выучил правила жизни среди людей — от «не брать чужое» до «не принадлежу»"}, {"ch": 9, "t": "Сел на пол перед листами с крупными знаками и начал учить инфернальные буквы у Фронки"}, {"ch": 11, "t": "Передал Фронки прощальное письмо Георгоса, которое носили за пазухой не час и не два"}, {"ch": 12, "t": "С кучи щебня командовал рабочими у пролома в стене поместья: «Это туда, а ты туда, а ты сюда». О закрытии порта не слышал; Сандрии велел пойти поесть."}], "ties": [{"who": "Сандрия", "t": "Из-за неё он и перешёл: увидел свечение в темноте и решил, что этих держат ни за что"}, {"who": "Последний Дварф", "t": "Диктует ему правила и оставляет распоряжения на случай, если отряд не вернётся"}, {"who": "Фронки", "t": "Учит его буквам — «скоро будем писать на стенах»"}, {"who": "Госпожа Калиста", "t": "Служил у неё стражником и всю дорогу прикрывался её именем"}], "open": ["Что он сделает с комнатой Георгоса, которую тот завещал ему в письме", "Зачем ему три пары очков сразу"], "first": 8, "note": "В ранних главах его имя пишут «Шмык», в последней — «Шмыг»; полное имя записано в управе как Уби Пш-хэ.", "gal": [], "hero": null}, "r": {"card": "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "gallery": [{"src": "assets/img/characters/shmyg/shmyg-master-formal-sunglasses.webp", "cap": "Основной MASTER · формальный", "alt": "Шмыг. Основной референс идентичности. Одна пара солнечных очков, жёсткая манишка, полный рост.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "master"}, {"src": "assets/img/characters/shmyg/shmyg-portrait-three-quarter.webp", "width": 810, "height": 1080, "fit": "contain", "canon": true, "role": "portrait", "cap": "Портрет · ¾", "alt": "Портрет · ¾"}, {"src": "assets/img/characters/shmyg/shmyg-master-casual-straw-no-glasses.webp", "cap": "Дополнительный MASTER · шляпа без очков", "alt": "Шмыг. Тот же Шмыг в повседневной одежде, соломенной шляпе, с открытыми глазами.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-casual-straw-sunglasses.webp", "cap": "Повседневный · шляпа и очки", "alt": "Шмыг. Просторная рубаха и брюки, плетёная соломенная шляпа и одна пара очков.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-hunting-hood-sunglasses.webp", "cap": "Охотничий · капюшон", "alt": "Шмыг. Оливковая туника, коричневая накидка и глубокий капюшон, который он придерживает у очков.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-guard-ch08-spear.webp", "cap": "Стражник главы 8 · копьё", "alt": "Шмыг. Ранний хронологический образ: лохмотья, разномастная кожаная защита, слишком длинное копьё.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-formal-front.webp", "cap": "Формальный · анфас", "alt": "Шмыг. Прямой вид спереди в полный рост.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "full"}, {"src": "assets/img/characters/shmyg/shmyg-formal-profile-facing-left.webp", "cap": "Формальный · профиль влево", "alt": "Шмыг. Строгий профиль: нос направлен влево на изображении.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-formal-back.webp", "cap": "Формальный · спина", "alt": "Шмыг. Прямой вид сзади. На затылке нет запасных очков или ремней.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-formal-profile-facing-right.webp", "cap": "Формальный · профиль вправо", "alt": "Шмыг. Строгий профиль: нос направлен вправо на изображении.", "width": 1086, "height": 1448, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-formal-face-ears-hands.webp", "cap": "Формальный · лицо, уши, кисти", "alt": "Шмыг. Лицо в двух ракурсах, положения ушей, ладонь и тыльная сторона кисти.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "detail"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-turnaround.webp", "cap": "Шляпа без очков · четыре стороны", "alt": "Шмыг. Исправленный лист: анфас, профиль влево, спина, профиль вправо.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "angle"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-closeups.webp", "cap": "Шляпа без очков · разные крупности", "alt": "Шмыг. Поясной портрет, лицо, профиль, глаза и нос, ухо и плетение шляпы.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "detail"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-three-poses.webp", "cap": "Шляпа без очков · три позы", "alt": "Шмыг. Важный шаг, неподвижное слушание, быстрый настороженный разворот.", "width": 1536, "height": 1024, "fit": "contain", "canon": true, "role": "pose"}, {"src": "assets/img/characters/shmyg/shmyg-straw-no-glasses-six-emotions.webp", "cap": "Шляпа без очков · шесть эмоций", "alt": "Шмыг. Важность, подозрение, удивл /aside></div>'+(q?'<blockquote>«'+esc(q.q)+'»<footer><a href="./#/kniga/ch'+String(q.ch).padStart(2,'0')+'">Глава '+q.ch+'</a>'+ (q.when?' · '+esc(q.when):'')+'</footer></blockquote>':'')+'<h3>Пластика персонажа</h3><div class="studies">'+imgs.map(g=>'<figure>'+image(g.src,g.cap)+'<figcaption>'+esc(g.cap)+'</figcaption></figure>').join('')+'</div><section><h3>След в истории</h3><ol class="chapter-list">'+(c.deeds||[]).slice(0,4).map(d=>'<li><a href="./#/kniga/ch'+String(d.ch).padStart(2,'0')+'">Глава '+d.ch+'</a> · '+esc(d.t)+'</li>').join('')+'</ol></section><footer class="closing"><span>Жребий / '+esc(c.name)+'</span><a href="./#/lica/'+c.id+'">Открыть текущее досье ↗</a></footer>';}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});select.onchange=render;sample.onclick=e=>{const b=e.target.closest('[data-image]');if(!b)return;zoom.querySelector('img').src=b.dataset.image;zoom.querySelector('img').alt=b.dataset.caption;zoom.querySelector('p').textContent=b.dataset.caption;zoom.showModal()};document.getElementById('closeZoom').onclick=()=>zoom.close();zoom.addEventListener('click',e=>{if(e.target===zoom)zoom.close()});render();
